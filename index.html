<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLA - Registro y Acceso</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-container { display: flex; flex-wrap: wrap; gap: 40px; max-width: 900px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); align-items: center; }
        .intro-side { flex: 1; min-width: 280px; text-align: center; }
        .intro-side img { width: 100%; max-width: 180px; filter: grayscale(100%) contrast(150%); margin-bottom: 20px; }
        .intro-side h2 { color: #003366; font-size: 22px; margin-bottom: 10px; }
        .intro-side p { color: #555; font-size: 14px; line-height: 1.5; }
        .form-side { flex: 1; min-width: 320px; background: #ffffff; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .form-side h3 { color: #003366; font-weight: 700; text-align: center; margin-bottom: 20px; font-size: 18px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .terms-box { height: 90px; overflow-y: auto; border: 1px solid #eee; padding: 10px; background: #f9f9f9; border-radius: 6px; font-size: 11px; color: #444; margin-top: 5px; }
        .terms-box label { display: block; margin-bottom: 6px; cursor: pointer; }
        .btn-register { background-color: #39ff14 !important; color: #000 !important; border: none; font-weight: bold; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; box-shadow: 0 4px 12px rgba(57, 255, 20, 0.4); text-transform: uppercase; margin-top: 15px; transition: transform 0.2s; }
        .btn-register:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="intro-side">
            <img src="https://campuslatinoamerica.edu.co/logosaliados/lennyfoto.png" alt="CampusLA Logo" onerror="this.src='https://via.placeholder.com/180x180?text=CampusLA'">
            <h2>Ecosistema Educativo CLA</h2>
            <p>Regístrate una sola vez y obtén acceso inmediato a tu perfil personal, control de cursos en Moodle y simuladores oficiales.</p>
        </div>

        <div class="form-side">
            <h3>¡Regístrate Ahora!</h3>
            <!-- Apuntando directo a FormSubmit para que te llegue el correo a eatramites1@gmail.com -->
            <form id="regForm">
                <!-- Parámetros ocultos para FormSubmit -->
                <input type="hidden" name="_subject" value="¡Nuevo Registro en CampusLA!">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">

                <div class="input-group">
                    <input type="text" name="nombre" id="nombre" placeholder="Nombre completo" required>
                    <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
                    <input type="tel" name="telefono" id="telefono" placeholder="Teléfono" required>
                    <input type="password" name="clave" id="clave" placeholder="Contraseña" required>
                    
                    <div class="terms-box">
                        <label>
                            <input type="checkbox" id="acepto_datos" required> Autorizo el tratamiento de datos según la Política de Privacidad.
                        </label>
                        <label>
                            <input type="checkbox" id="acepto_terminos" required> Acepto los Términos y Condiciones del servicio.
                        </label>
                    </div>
                </div>

                <button type="submit" id="main-register-btn" class="btn-register">Registrarse Ahora</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evitamos que la página haga el submit tradicional en bruto

            const btn = document.getElementById('main-register-btn');
            btn.innerText = 'CONFIGURANDO TU PERFIL...';
            btn.disabled = true;

            const nombreVal = document.getElementById('nombre').value;
            const emailVal = document.getElementById('email').value;
            const telefonoVal = document.getElementById('telefono').value;

            // 1. Guardamos la sesión localmente
            const userSession = {
                nombre: nombreVal,
                email: emailVal,
                telefono: telefonoVal,
                fechaRegistro: new Date().toISOString()
            };
            localStorage.setItem('cla_user_session', JSON.stringify(userSession));

            // 2. Disparamos el correo a FormSubmit por detrás (hacia eatramites1@gmail.com)
            const formData = new FormData(this);
            fetch("https://formsubmit.co/ajax/eatramites1@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .catch(error => console.log('Aviso enviado a Gmail:', error));

            // 3. Redirigimos de forma segura a la raíz del repositorio sin romper con archivos inexistentes
            setTimeout(() => {
                window.location.href = './';
            }, 600);
        });
    </script>
</body>
</html>
