<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLA - Perfil Personal</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .profile-container { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 600px; }
        h2 { color: #003366; text-align: center; margin-bottom: 20px; }
        .user-info { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 20px; }
        .user-info p { margin: 10px 0; color: #333; font-size: 15px; }
        .user-info strong { color: #003366; }
        .btn-logout { background-color: #ff3b30; color: #fff; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px; text-transform: uppercase; transition: background 0.2s; }
        .btn-logout:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div class="profile-container">
        <h2>Mi Perfil Personal</h2>
        
        <div class="user-info" id="infoBox">
            <p><strong>Nombre:</strong> <span id="lblNombre">Cargando...</span></p>
            <p><strong>Correo Electrónico:</strong> <span id="lblEmail">Cargando...</span></p>
            <p><strong>Teléfono:</strong> <span id="lblTelefono">Cargando...</span></p>
            <p><strong>Fecha de Registro:</strong> <span id="lblFecha">Cargando...</span></p>
        </div>

        <button type="button" id="btnLogout" class="btn-logout">Cerrar Sesión</button>
    </div>

    <script>
        // Cargar datos del usuario desde el localStorage
        const savedSession = localStorage.getItem('cla_user_session');

        if (savedSession) {
            try {
                const userData = JSON.parse(savedSession);
                document.getElementById('lblNombre').innerText = userData.nombre || 'No especificado';
                document.getElementById('lblEmail').innerText = userData.email || 'No especificado';
                document.getElementById('lblTelefono').innerText = userData.telefono || 'No especificado';
                document.getElementById('lblFecha').innerText = userData.fechaRegistro ? new Date(userData.fechaRegistro).toLocaleString() : 'No especificada';
            } catch (e) {
                console.error('Error al parsear la sesión', e);
            }
        } else {
            // Si no hay sesión, redirigir al tablero de pruebas de una vez
            window.location.href = 'https://campusla.github.io/tableroestudiantesprueba/';
        }

        // BOTÓN DE CIERRE DE SESIÓN CORREGIDO (Obliga a ir al tablero de pruebas)
        document.getElementById('btnLogout').addEventListener('click', function() {
            // Limpiamos los datos locales de sesión
            localStorage.removeItem('cla_user_session');
            
            // Redirección estricta al tablero de pruebas
            window.location.href = 'https://campusla.github.io/tableroestudiantesprueba/';
        });
    </script>
</body>
</html>
